name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - name: Test (race)
        env:
          CGO_ENABLED: 1   # the race detector needs cgo
        run: go test -race -count=1 ./...

  selfcheck:
    name: grades a live site and emits valid SARIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      # An end-to-end check against a real site. It asserts the tool runs and
      # produces a parseable report, not a particular score -- grading someone
      # else's live headers would make this build fail when they deploy.
      - name: Scan a live site
        run: |
          go run ./cmd/header-grader -format json -o report.json github.com
          python3 - <<'PY'
          import json, sys
          d = json.load(open("report.json"))
          assert isinstance(d["score"], int) and 0 <= d["score"] <= 100, d["score"]
          assert d["grade"] in {"A+","A","B","C","D","E","F"}, d["grade"]
          assert d["findings"], "no findings at all is suspicious"
          for f in d["findings"]:
              assert f["id"] and f["title"] and f["severity"] in {"info","low","medium","high","critical"}, f
          print(f"ok: score {d['score']} grade {d['grade']}, {len(d['findings'])} findings")
          PY

      - name: SARIF output is valid
        run: |
          go run ./cmd/header-grader -format sarif -o results.sarif example.com
          python3 - <<'PY'
          import json
          d = json.load(open("results.sarif"))
          assert d["version"] == "2.1.0", d["version"]
          run = d["runs"][0]
          assert run["tool"]["driver"]["name"] == "header-grader"
          assert run["results"], "expected findings for example.com"
          rules = {r["id"] for r in run["tool"]["driver"]["rules"]}
          for r in run["results"]:
              assert r["ruleId"] in rules, f"result references an undeclared rule: {r['ruleId']}"
              assert r["level"] in {"error","warning","note"}, r["level"]
          print(f"ok: {len(run['results'])} SARIF results, {len(rules)} rules")
          PY

      # The gate must actually gate: example.com has no CSP, so -fail-on high
      # has to exit non-zero.
      - name: Exit codes gate correctly
        run: |
          if go run ./cmd/header-grader -fail-on high example.com >/dev/null 2>&1; then
            echo "::error::-fail-on high should have failed for example.com"; exit 1
          fi
          go run ./cmd/header-grader -fail-under 0 example.com >/dev/null
          echo "ok: gates behave as documented"

  docker:
    name: image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: header-grader:ci
      - run: docker run --rm header-grader:ci -version
      - run: docker run --rm header-grader:ci -format json -no-tls-probe example.com | head -5

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code go.mod
